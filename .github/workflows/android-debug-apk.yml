name: Build IKAR Assistant Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install native YARA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libtool make gcc pkg-config flex bison
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build official libyara for Android ARMv7
        env:
          YARA_TAG: v4.5.0
          ANDROID_API: "23"
        run: bash scripts/build-libyara-android-armv7.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK and ARMv7 ABI presence
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          LIBS=$(unzip -Z1 "$APK" | grep '^lib/' || true)
          if [ -n "$LIBS" ]; then
            echo "Native libraries detected in APK."
            echo "$LIBS" | grep -q '^lib/armeabi-v7a/' || { echo 'Missing armeabi-v7a native libraries'; exit 1; }
          else
            echo "No packaged native libraries: Kotlin/Java bytecode remains ABI-neutral."
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ikar-assistant-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
