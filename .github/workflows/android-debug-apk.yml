name: Build IKAR Assistant Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install native YARA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake libtool make gcc pkg-config flex bison
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build official libyara for Android ARMv7
        env:
          YARA_TAG: v4.5.0
          ANDROID_API: "23"
        run: bash scripts/build-libyara-android-armv7.sh
      - name: Validate YARA Forge Core rules with YARA 4.5.0
        run: |
          git clone --depth 1 --branch v4.5.0 https://github.com/VirusTotal/yara.git /tmp/yara-host
          cd /tmp/yara-host
          ./bootstrap.sh
          ./configure --disable-shared --enable-static --without-crypto
          make -j2
          cd "$GITHUB_WORKSPACE"
          python3 scripts/validate-yara-forge-package.py /tmp/yara-host/yarac
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify APK and ARMv7 ABI presence
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          NATIVE_LIB=lib/armeabi-v7a/libikar_yara.so
          unzip -Z1 "$APK" | grep -qx "$NATIVE_LIB" || { echo "Missing official libyara JNI library: $NATIVE_LIB"; exit 1; }
          unzip -p "$APK" "$NATIVE_LIB" > /tmp/libikar_yara.so
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/llvm-readelf" -h /tmp/libikar_yara.so | tee /tmp/ikar-yara-elf.txt
          grep -q "ARM" /tmp/ikar-yara-elf.txt || { echo "JNI library is not ARMv7"; exit 1; }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ikar-assistant-v1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
